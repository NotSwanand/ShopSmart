name: shopsmart1
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  barcode_scan2: ^4.5.0
  logger: ^2.5.0
  provider: ^6.1.2
